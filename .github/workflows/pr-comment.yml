name: PR Comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Add PR Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.workflow_run.pull_requests[0]?.number;
            if (!prNumber) {
              core.setOutput('skip', 'true');
              return;
            }
            core.setOutput('number', prNumber);
            core.setOutput('skip', 'false');

      - name: Download artifacts info
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        id: artifacts
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            const artifactList = artifacts.data.artifacts.map(a => `- ${a.name}`).join('\n');
            core.setOutput('list', artifactList || 'No artifacts available');

      - name: Comment on PR
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const status = context.payload.workflow_run.conclusion;
            const statusEmoji = status === 'success' ? '✅' : '❌';
            const runUrl = context.payload.workflow_run.html_url;
            const artifacts = `${{ steps.artifacts.outputs.list }}`;

            const body = `## ${statusEmoji} CI Results

**Status:** ${status}
**Run:** [View Details](${runUrl})

### Available Artifacts
${artifacts}

*Artifacts are available for download from the [workflow run](${runUrl}).*`;

            // Find existing comment from this workflow
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CI Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
