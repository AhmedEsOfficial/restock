# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Gradle JVM arguments
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable parallel execution
org.gradle.parallel=true

# Enable caching for faster builds
org.gradle.caching=true

# Enable configuration cache for improved build performance
org.gradle.configuration-cache=true

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable non-transitive R classes for better isolation
android.nonTransitiveRClass=true

# Suppress build config deprecation warning (enabled per-module in build.gradle.kts)

# Suppress KSP warnings
ksp.incremental=true
